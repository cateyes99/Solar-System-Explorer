<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060f" />
    <meta
      name="description"
      content="Solar System Explorer — an immersive, interactive 3D adventure through our Solar System for curious kids and grown-ups."
    />
    <title>Solar System Explorer — Interactive 3D Space Adventure</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23070c1c'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ff8a2b'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%234fd8ff' stroke-opacity='0.55'/%3E%3Ccircle cx='28' cy='13' r='2' fill='%234fd8ff'/%3E%3C/svg%3E"
    />
    <style>
      /* Inline boot splash: the visitor never stares at a blank screen. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #04060f;
        color: #e8f1ff;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 0;
        background: radial-gradient(circle at 50% 45%, #0b1330 0%, #04060f 65%);
        z-index: 50;
      }
      #boot-splash .boot-inner {
        text-align: center;
        animation: boot-fade 1.1s ease-out both;
      }
      #boot-splash .boot-sun {
        width: 96px;
        height: 96px;
        margin: 0 auto 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 32%, #fff6d0 0%, #ffbf49 42%, #ff7a18 72%, rgba(255, 90, 0, 0) 74%);
        box-shadow: 0 0 70px 18px rgba(255, 138, 43, 0.35);
        animation: boot-pulse 2.6s ease-in-out infinite;
      }
      #boot-splash .boot-orbit {
        width: 190px;
        height: 190px;
        margin: -142px auto 118px;
        border: 1px solid rgba(79, 216, 255, 0.28);
        border-radius: 50%;
        animation: boot-spin 7s linear infinite;
      }
      #boot-splash .boot-orbit::after {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 90px;
        border-radius: 50%;
        background: #4fd8ff;
        box-shadow: 0 0 14px 3px rgba(79, 216, 255, 0.6);
      }
      #boot-splash h1 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #cfe4ff;
      }
      #boot-splash p {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.12em;
        color: #7f93b8;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(1.06);
          filter: brightness(1.12);
        }
      }
      @keyframes boot-fade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-sun,
        #boot-splash .boot-orbit,
        #boot-splash .boot-inner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="boot-inner">
          <div class="boot-orbit"></div>
          <div class="boot-sun"></div>
          <h1>Solar System Explorer</h1>
          <p>Preparing the Solar System…</p>
        </div>
      </div>
    </div>
    <noscript>
      <div style="position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;">
        <p style="max-width: 42ch; line-height: 1.6">
          Solar System Explorer needs JavaScript to fly you through space. Please enable JavaScript and reload the page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
